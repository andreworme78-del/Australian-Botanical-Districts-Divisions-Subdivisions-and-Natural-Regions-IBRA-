<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Australian Botanical Subdivisions - Coordinate Search</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9coqIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <!-- Proj4js for UTM conversion -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.min.js"></script>

  <!-- Leaflet Omnivore -->
  <script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
      background-color: #f4f6f4;
    }


    /* ==========================================
       SIDEBAR
       ========================================== */

    #sidebar {
      width: 320px;
      background: #ffffff;
      padding: 25px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
    }

    h2 {
      color: #2c4c38;
      margin-top: 0;
      font-size: 1.4rem;
      border-bottom: 2px solid #e2ece6;
      padding-bottom: 10px;
    }

    .description {
      font-size: 0.85rem;
      color: #556b2f;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2c4c38;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #1e3527;
    }

    #error-msg {
      color: #b22222;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
      font-weight: 500;
    }


    /* ==========================================
       MAP
       ========================================== */

    #map {
      flex: 1 1 auto;
      min-width: 0;
      height: 100vh;
    }


    /* ==========================================
       SUBDIVISION LABELS
       ========================================== */

    .subdivision-label {
      background: transparent;
      border: none;
      box-shadow: none;
      color: #202020;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;

      text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0px  0px 3px #ffffff;
    }

    .subdivision-label::before {
      display: none;
    }


    /* ==========================================
       STATE FILTER CONTROL
       ========================================== */

    .state-filter-control {
      background: rgba(255,255,255,0.96);
      padding: 10px 12px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      min-width: 185px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
    }

    .state-filter-title {
      font-size: 13px;
      font-weight: 700;
      color: #2c4c38;
      margin-bottom: 6px;
    }

    .state-filter-control label {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-weight: normal;
      margin: 4px 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .state-filter-control input[type="checkbox"] {
      width: auto;
      margin: 0 7px 0 0;
      padding: 0;
    }

    .state-filter-buttons {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid #ddd;
    }

    .state-filter-buttons button {
      width: auto;
      flex: 1;
      padding: 5px 7px;
      font-size: 11px;
      background: #eef2ef;
      color: #2c4c38;
      border: 1px solid #ccd6cf;
    }

    .state-filter-buttons button:hover {
      background: #dde7e0;
    }

    .unavailable-state {
      color: #999;
    }

    .unavailable-note {
      font-size: 9px;
      margin-left: 3px;
      color: #999;
    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 768px) {

      body {
        flex-direction: column-reverse;
      }

      #sidebar {
        width: 100%;
      }

      #map {
        height: 60vh;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       SIDEBAR
       ========================================== -->

  <div id="sidebar">

    <h2>
      Botanical Subdivisions Lookup
    </h2>

    <div class="description">
      Search coordinates to plot botanical field data across Australia.
      Supports standard Latitude / Longitude or Australian UTM Grid coordinates.
      Use the map controls to switch subdivision outlines, colour, labels and
      individual states or territories on or off.
    </div>


    <div class="input-group">

      <label for="coord-type">
        Coordinate Input Type
      </label>

      <select id="coord-type">

        <option value="latlng">
          Latitude / Longitude (Decimal)
        </option>

        <option value="utm">
          UTM (Easting / Northing)
        </option>

      </select>

    </div>


    <div
      id="utm-fields"
      style="display:none;"
    >

      <div class="input-group">

        <label for="utm-zone">
          Australian UTM Zone
        </label>

        <select id="utm-zone">

          <option value="49">Zone 49 (WA West)</option>
          <option value="50">Zone 50 (WA Central)</option>
          <option value="51">Zone 51 (WA East / NT West)</option>
          <option value="52">Zone 52 (NT Central / SA West)</option>
          <option value="53">Zone 53 (NT East / SA Central)</option>
          <option value="54">Zone 54 (QLD West / NSW West / SA East)</option>
          <option value="55">Zone 55 (QLD Central / NSW Central / VIC / TAS)</option>
          <option value="56">Zone 56 (QLD East / NSW East)</option>

        </select>

      </div>

    </div>


    <div class="input-group">

      <label
        id="label-x"
        for="input-x"
      >
        Latitude (e.g., -33.8688)
      </label>

      <input
        type="text"
        id="input-x"
        placeholder="-33.8688"
      >

    </div>


    <div class="input-group">

      <label
        id="label-y"
        for="input-y"
      >
        Longitude (e.g., 151.2093)
      </label>

      <input
        type="text"
        id="input-y"
        placeholder="151.2093"
      >

    </div>


    <button id="locate-btn">
      Locate Subdivision Spot
    </button>


    <div id="error-msg"></div>

  </div>



  <!-- ==========================================
       MAP
       ========================================== -->

  <div id="map"></div>



  <script>


    /* =====================================================
       CREATE MAP
       ===================================================== */

    const map = L.map("map").setView(
      [-27.0, 133.0],
      4
    );



    /* =====================================================
       OPENSTREETMAP
       ===================================================== */

    const osm = L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
      }

    ).addTo(map);



    /* =====================================================
       CREATE THE THREE WORKING SUBDIVISION LAYERS
       ===================================================== */

    const subdivisionOutlines =
      L.layerGroup();

    const subdivisionColour =
      L.layerGroup();

    const subdivisionLabels =
      L.layerGroup();



    /* =====================================================
       STATE SETTINGS
       ===================================================== */

    const stateEnabled = {

      VIC: true,
      NSW: true,
      NT: true,
      QLD: true,
      SA: true,
      WA: true

    };



    /*
      Store the actual Leaflet layers belonging
      to each state.

      This lets us filter states WITHOUT changing
      the working KML parsing system.
    */

    const stateLayers = {

      VIC: {
        outlines: [],
        colours: [],
        labels: []
      },

      NSW: {
        outlines: [],
        colours: [],
        labels: []
      },

      NT: {
        outlines: [],
        colours: [],
        labels: []
      },

      QLD: {
        outlines: [],
        colours: [],
        labels: []
      },

      SA: {
        outlines: [],
        colours: [],
        labels: []
      },

      WA: {
        outlines: [],
        colours: [],
        labels: []
      }

    };



    /* =====================================================
       KML FILE
       ===================================================== */

    const kmlFile =
      "Australian Botanical Subdivisions.kml";



    /* =====================================================
       LOAD KML
       ===================================================== */

    fetch(kmlFile)

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Could not load " + kmlFile
          );

        }

        return response.text();

      })


      .then(function(kmlText) {


        /*
          This is the same working method as before:
          parse the complete KML as XML.
        */

        const parser =
          new DOMParser();


        const kmlDocument =
          parser.parseFromString(
            kmlText,
            "text/xml"
          );



        /*
          Find every Placemark.
        */

        const placemarks =
          Array.from(
            kmlDocument.getElementsByTagNameNS(
              "*",
              "Placemark"
            )
          );



        /*
          Bounds covering all subdivisions.
        */

        const allBounds =
          L.latLngBounds([]);



        /* =================================================
           PROCESS EACH PLACEMARK
           ================================================= */

        placemarks.forEach(

          function(placemark) {


            /* ---------------------------------------------
               READ REAL KML PLACEMARK NAME
               --------------------------------------------- */

            let subdivisionName =
              "Unnamed subdivision";


            const nameElements =
              placemark.getElementsByTagNameNS(
                "*",
                "name"
              );


            if (nameElements.length > 0) {

              const nameText =
                nameElements[0]
                  .textContent
                  .trim();


              if (nameText) {

                subdivisionName =
                  nameText;

              }

            }



            /* ---------------------------------------------
               DETERMINE STATE FROM PARENT KML FOLDER
               --------------------------------------------- */

            const stateCode =
              getStateFromPlacemark(
                placemark
              );



            /*
              If for some reason a Placemark cannot be
              associated with a state folder, we still
              display it. It simply won't be affected
              by the state checkboxes.
            */



            /* ---------------------------------------------
               CREATE MINI KML DOCUMENT
               --------------------------------------------- */

            const miniKml =
              document.implementation
                .createDocument(
                  "http://www.opengis.net/kml/2.2",
                  "kml",
                  null
                );


            const miniDocument =
              miniKml.createElementNS(
                "http://www.opengis.net/kml/2.2",
                "Document"
              );


            miniKml.documentElement
              .appendChild(
                miniDocument
              );


            miniDocument.appendChild(

              miniKml.importNode(
                placemark,
                true
              )

            );


            const serializer =
              new XMLSerializer();


            const miniKmlText =
              serializer.serializeToString(
                miniKml
              );



            /* ---------------------------------------------
               PARSE GEOMETRY USING OMNIVORE
               --------------------------------------------- */

            const tempLayer =
              omnivore.kml.parse(
                miniKmlText
              );



            /* ---------------------------------------------
               PROCESS EACH GEOMETRY
               --------------------------------------------- */

            tempLayer.eachLayer(

              function(layer) {


                if (!layer.getBounds) {

                  return;

                }


                const bounds =
                  layer.getBounds();


                if (!bounds.isValid()) {

                  return;

                }


                allBounds.extend(
                  bounds
                );



                /* =========================================
                   OUTLINE LAYER
                   ========================================= */

                if (layer.toGeoJSON) {


                  const geojson =
                    layer.toGeoJSON();


                  const outlineLayer =
                    L.geoJSON(

                      geojson,

                      {

                        style: {

                          color: "#c0392b",

                          weight: 1.5,

                          opacity: 0.9,

                          fill: false,

                          fillOpacity: 0

                        }

                      }

                    );


                  outlineLayer.bindPopup(

                    "<strong>" +
                    escapeHtml(
                      subdivisionName
                    ) +
                    "</strong>"

                  );


                  subdivisionOutlines.addLayer(
                    outlineLayer
                  );



                  /*
                    Store reference to this outline
                    under its state.
                  */

                  if (
                    stateCode &&
                    stateLayers[stateCode]
                  ) {

                    stateLayers[
                      stateCode
                    ].outlines.push(
                      outlineLayer
                    );

                  }



                  /* =======================================
                     COLOUR / HIGHLIGHT LAYER
                     ======================================= */

                  const colourLayer =
                    L.geoJSON(

                      geojson,

                      {

                        style: {

                          color: "transparent",

                          weight: 0,

                          fillColor: "#d95f4f",

                          fill: true,

                          fillOpacity: 0.20

                        },

                        interactive: false

                      }

                    );


                  subdivisionColour.addLayer(
                    colourLayer
                  );



                  /*
                    Store reference to this colour
                    under its state.
                  */

                  if (
                    stateCode &&
                    stateLayers[stateCode]
                  ) {

                    stateLayers[
                      stateCode
                    ].colours.push(
                      colourLayer
                    );

                  }


                }

              }

            );



            /* ---------------------------------------------
               ONE LABEL PER NAMED SUBDIVISION
               --------------------------------------------- */

            if (
              tempLayer.getBounds &&
              tempLayer.getBounds().isValid()
            ) {


              const centre =
                tempLayer
                  .getBounds()
                  .getCenter();


              const labelMarker =
                L.marker(

                  centre,

                  {

                    interactive: false,

                    icon: L.divIcon(

                      {

                        className:
                          "subdivision-label",

                        html:
                          escapeHtml(
                            subdivisionName
                          ),

                        iconSize: null

                      }

                    )

                  }

                );


              subdivisionLabels.addLayer(
                labelMarker
              );



              /*
                Store reference to this label
                under its state.
              */

              if (
                stateCode &&
                stateLayers[stateCode]
              ) {

                stateLayers[
                  stateCode
                ].labels.push(
                  labelMarker
                );

              }


            }


          }

        );



        /* =================================================
           ADD DEFAULT LAYERS
           ================================================= */

        subdivisionOutlines.addTo(map);

        subdivisionColour.addTo(map);

        subdivisionLabels.addTo(map);



        /* =================================================
           ZOOM TO ALL SUBDIVISIONS
           ================================================= */

        if (allBounds.isValid()) {

          map.fitBounds(
            allBounds
          );

        }


      })


      .catch(function(error) {


        console.error(
          "KML loading error:",
          error
        );


        showError(
          "The Australian Botanical Subdivisions KML could not be loaded."
        );


      });



    /* =====================================================
       STANDARD LEAFLET LAYER CONTROL

       This preserves the three controls from the
       version that was already working.
       ===================================================== */

    const baseMaps = {

      "OpenStreetMap":
        osm

    };


    const overlayMaps = {

      "Botanical Subdivisions":
        subdivisionOutlines,

      "Subdivision Colour":
        subdivisionColour,

      "Subdivision Labels":
        subdivisionLabels

    };


    L.control.layers(

      baseMaps,

      overlayMaps,

      {
        collapsed: false
      }

    ).addTo(map);



    /* =====================================================
       STATE FILTER CONTROL
       ===================================================== */

    const StateFilterControl =
      L.Control.extend({

        options: {
          position: "bottomright"
        },


        onAdd: function(map) {


          const container =
            L.DomUtil.create(
              "div",
              "state-filter-control"
            );


          container.innerHTML = `

            <div class="state-filter-title">
              States & Territories
            </div>


            <label>
              <input
                type="checkbox"
                class="state-checkbox"
                data-state="VIC"
                checked
              >
              Victoria
            </label>


            <label>
              <input
                type="checkbox"
                class="state-checkbox"
                data-state="NSW"
                checked
              >
              New South Wales
            </label>


            <label>
              <input
                type="checkbox"
                class="state-checkbox"
                data-state="QLD"
                checked
              >
              Queensland
            </label>


            <label>
              <input
                type="checkbox"
                class="state-checkbox"
                data-state="SA"
                checked
              >
              South Australia
            </label>


            <label>
              <input
                type="checkbox"
                class="state-checkbox"
                data-state="WA"
                checked
              >
              Western Australia
            </label>


            <label>
              <input
                type="checkbox"
                class="state-checkbox"
                data-state="NT"
                checked
              >
              Northern Territory
            </label>


            <label class="unavailable-state">

              <input
                type="checkbox"
                disabled
              >

              Tasmania

              <span class="unavailable-note">
                (not in KML)
              </span>

            </label>


            <div class="state-filter-buttons">

              <button
                type="button"
                id="states-all"
              >
                All
              </button>

              <button
                type="button"
                id="states-none"
              >
                None
              </button>

            </div>

          `;



          /*
            Prevent interaction with this box from
            dragging or zooming the map.
          */

          L.DomEvent.disableClickPropagation(
            container
          );


          L.DomEvent.disableScrollPropagation(
            container
          );



          /*
            State checkbox events.
          */

          const checkboxes =
            container.querySelectorAll(
              ".state-checkbox"
            );


          checkboxes.forEach(

            function(checkbox) {


              checkbox.addEventListener(

                "change",

                function() {


                  const state =
                    this.dataset.state;


                  stateEnabled[state] =
                    this.checked;


                  updateStateVisibility(
                    state
                  );


                }

              );


            }

          );



          /* ---------------------------------------------
             ALL BUTTON
             --------------------------------------------- */

          container
            .querySelector(
              "#states-all"
            )
            .addEventListener(

              "click",

              function() {


                checkboxes.forEach(

                  function(checkbox) {


                    checkbox.checked =
                      true;


                    const state =
                      checkbox.dataset.state;


                    stateEnabled[state] =
                      true;


                    updateStateVisibility(
                      state
                    );


                  }

                );


              }

            );



          /* ---------------------------------------------
             NONE BUTTON
             --------------------------------------------- */

          container
            .querySelector(
              "#states-none"
            )
            .addEventListener(

              "click",

              function() {


                checkboxes.forEach(

                  function(checkbox) {


                    checkbox.checked =
                      false;


                    const state =
                      checkbox.dataset.state;


                    stateEnabled[state] =
                      false;


                    updateStateVisibility(
                      state
                    );


                  }

                );


              }

            );


          return container;

        }

      });


    map.addControl(
      new StateFilterControl()
    );



    /* =====================================================
       STATE VISIBILITY

       IMPORTANT:
       We do NOT rebuild the map.

       We only add/remove the already-created child
       layers from the three working layer groups.
       ===================================================== */

    function updateStateVisibility(
      state
    ) {


      if (!stateLayers[state]) {

        return;

      }


      const visible =
        stateEnabled[state];



      /* ---------------------------------------------
         OUTLINES
         --------------------------------------------- */

      stateLayers[
        state
      ].outlines.forEach(

        function(layer) {


          if (visible) {


            if (
              !subdivisionOutlines.hasLayer(
                layer
              )
            ) {

              subdivisionOutlines.addLayer(
                layer
              );

            }


          }

          else {


            if (
              subdivisionOutlines.hasLayer(
                layer
              )
            ) {

              subdivisionOutlines.removeLayer(
                layer
              );

            }


          }


        }

      );



      /* ---------------------------------------------
         COLOURS
         --------------------------------------------- */

      stateLayers[
        state
      ].colours.forEach(

        function(layer) {


          if (visible) {


            if (
              !subdivisionColour.hasLayer(
                layer
              )
            ) {

              subdivisionColour.addLayer(
                layer
              );

            }


          }

          else {


            if (
              subdivisionColour.hasLayer(
                layer
              )
            ) {

              subdivisionColour.removeLayer(
                layer
              );

            }


          }


        }

      );



      /* ---------------------------------------------
         LABELS
         --------------------------------------------- */

      stateLayers[
        state
      ].labels.forEach(

        function(layer) {


          if (visible) {


            if (
              !subdivisionLabels.hasLayer(
                layer
              )
            ) {

              subdivisionLabels.addLayer(
                layer
              );

            }


          }

          else {


            if (
              subdivisionLabels.hasLayer(
                layer
              )
            ) {

              subdivisionLabels.removeLayer(
                layer
              );

            }


          }


        }

      );


    }



    /* =====================================================
       FIND STATE FROM KML FOLDER

       The actual KML contains these folders:

       Victorian subdivisions
       NSW subdivisions
       Northern Territory subdivisions
       QLD subdivisions
       South Australia subdivisions
       Western Australia subdivisions
       ===================================================== */

    function getStateFromPlacemark(
      placemark
    ) {


      let parent =
        placemark.parentNode;


      while (parent) {


        if (
          parent.nodeType === 1 &&
          parent.localName === "Folder"
        ) {


          let folderName =
            "";


          /*
            Read only the Folder's direct child <name>,
            not the names of its Placemarks.
          */

          for (
            const child of parent.children
          ) {


            if (
              child.localName === "name"
            ) {


              folderName =
                child.textContent
                  .trim()
                  .toLowerCase();


              break;

            }


          }



          if (
            folderName.includes(
              "victorian"
            ) ||
            folderName.includes(
              "victoria"
            )
          ) {

            return "VIC";

          }



          if (
            folderName.includes(
              "nsw"
            ) ||
            folderName.includes(
              "new south wales"
            )
          ) {

            return "NSW";

          }



          if (
            folderName.includes(
              "northern territory"
            )
          ) {

            return "NT";

          }



          if (
            folderName.includes(
              "qld"
            ) ||
            folderName.includes(
              "queensland"
            )
          ) {

            return "QLD";

          }



          if (
            folderName.includes(
              "south australia"
            )
          ) {

            return "SA";

          }



          if (
            folderName.includes(
              "western australia"
            )
          ) {

            return "WA";

          }


        }


        parent =
          parent.parentNode;


      }


      return null;


    }



    /* =====================================================
       COORDINATE SEARCH
       ===================================================== */

    let currentMarker =
      null;


    const coordTypeSelect =
      document.getElementById(
        "coord-type"
      );


    const utmFields =
      document.getElementById(
        "utm-fields"
      );


    const labelX =
      document.getElementById(
        "label-x"
      );


    const labelY =
      document.getElementById(
        "label-y"
      );


    const inputX =
      document.getElementById(
        "input-x"
      );


    const inputY =
      document.getElementById(
        "input-y"
      );



    /* =====================================================
       SWITCH COORDINATE TYPE
       ===================================================== */

    coordTypeSelect.addEventListener(

      "change",

      function() {


        if (
          this.value === "utm"
        ) {


          utmFields.style.display =
            "block";


          labelX.innerText =
            "Easting (6 digits, e.g., 334000)";


          labelY.innerText =
            "Northing (7 digits, e.g., 6251000)";


          inputX.placeholder =
            "334000";


          inputY.placeholder =
            "6251000";


        }

        else {


          utmFields.style.display =
            "none";


          labelX.innerText =
            "Latitude (e.g., -33.8688)";


          labelY.innerText =
            "Longitude (e.g., 151.2093)";


          inputX.placeholder =
            "-33.8688";


          inputY.placeholder =
            "151.2093";


        }


      }

    );



    /* =====================================================
       LOCATE BUTTON
       ===================================================== */

    document
      .getElementById(
        "locate-btn"
      )
      .addEventListener(

        "click",

        function() {


          const errorDiv =
            document.getElementById(
              "error-msg"
            );


          errorDiv.style.display =
            "none";



          const val1 =
            parseFloat(
              inputX.value.trim()
            );


          const val2 =
            parseFloat(
              inputY.value.trim()
            );



          if (
            isNaN(val1) ||
            isNaN(val2)
          ) {


            showError(
              "Please enter valid numerical coordinate values."
            );


            return;

          }



          let targetLat;

          let targetLng;



          /* ===============================================
             UTM
             =============================================== */

          if (
            coordTypeSelect.value ===
            "utm"
          ) {


            const zone =
              document
                .getElementById(
                  "utm-zone"
                )
                .value;


            const utmProj =

              `+proj=utm +zone=${zone} +south +ellps=WGS84 +datum=WGS84 +units=m +no_defs`;


            const wgs84Proj =

              "+proj=longlat +datum=WGS84 +no_defs";


            try {


              const converted =
                proj4(

                  utmProj,

                  wgs84Proj,

                  [
                    val1,
                    val2
                  ]

                );


              targetLng =
                converted[0];


              targetLat =
                converted[1];



              if (

                targetLat < -45 ||

                targetLat > -10 ||

                targetLng < 110 ||

                targetLng > 155

              ) {


                showError(

                  "The converted UTM coordinates fall outside the bounds of Australia."

                );


                return;

              }


            }

            catch (err) {


              showError(

                "Projection failed. Verify your Easting and Northing values."

              );


              return;

            }


          }



          /* ===============================================
             LATITUDE / LONGITUDE
             =============================================== */

          else {


            targetLat =
              val1;


            targetLng =
              val2;



            if (

              targetLat < -90 ||

              targetLat > 90 ||

              targetLng < -180 ||

              targetLng > 180

            ) {


              showError(
                "Please enter valid latitude and longitude values."
              );


              return;

            }


          }



          /* ===============================================
             REMOVE PREVIOUS MARKER
             =============================================== */

          if (currentMarker) {


            map.removeLayer(
              currentMarker
            );


          }



          /* ===============================================
             ADD NEW MARKER
             =============================================== */

          currentMarker =

            L.marker(

              [
                targetLat,
                targetLng
              ]

            )

            .addTo(map)

            .bindPopup(

              `<b>Target Field Coordinates</b><br>
               Lat: ${targetLat.toFixed(5)}<br>
               Lng: ${targetLng.toFixed(5)}`

            )

            .openPopup();



          map.setView(

            [
              targetLat,
              targetLng
            ],

            14

          );


        }

      );



    /* =====================================================
       ESCAPE KML TEXT
       ===================================================== */

    function escapeHtml(
      text
    ) {


      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;


    }



    /* =====================================================
       ERROR MESSAGE
       ===================================================== */

    function showError(
      text
    ) {


      const errorDiv =
        document.getElementById(
          "error-msg"
        );


      errorDiv.innerText =
        text;


      errorDiv.style.display =
        "block";


    }


  </script>


</body>

</html>
